<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container-fluid d-flex align-items-center overflow-hidden">

        <!-- Left: Logo -->
        <div class="d-flex align-items-center">
            <!-- Hamburger visible only on mobile -->
            <button class="btn icon-btn me-2 d-md-none" type="button" aria-label="menu">
                <i class="bi bi-list"></i>
            </button>
            <img
                src="assets/logo-sem-escrita.png"
                alt="BubbleTalk"
                height="32"
                class="me-2"
            />
        </div>

        <!-- Center: Search -->
        <div class="flex-grow-1 px-4 d-none d-md-flex justify-content-center">
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input
                    type="text"
                    class="form-control text-center"
                    placeholder="Buscar qualquer coisa"
                />
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="d-flex align-items-center">

            <!-- Create -->
            <!-- Mobile search icon (visible only on small screens) -->
            <button class="btn icon-btn me-2 d-md-none mobile-search" type="button" aria-label="search">
                <i class="bi bi-search"></i>
            </button>

            <button class="btn btn-criar fw-bold me-2">
                <i class="bi bi-plus-circle-fill fs-5"></i>
                <span class="btn-text">Criar</span>
            </button>

            <!-- Notifications -->
            <button class="btn icon-btn me-2">
                <i class="bi bi-bell"></i>
            </button>

            <!-- Profile dropdown -->
            <div class="dropdown" [class.show]="menuOpen">
                <button
                    #toggle
                    class="btn d-flex align-items-center"
                    type="button"
                    (click)="$event.stopPropagation(); toggleMenu($event)"
                    [attr.aria-expanded]="menuOpen"
                >
                    <img
                        src="assets/erik.jpg"
                        class="rounded-circle"
                        height="32"
                        width="32"
                    />
                </button>

                <div
                    #menu
                    class="dropdown-menu dropdown-menu-end"
                    [class.show]="menuOpen"
                    [class.mobile-drawer]="isMobileView"
                    [ngStyle]="menuStyles"
                >
                    <div *ngIf="isMobileView" class="drawer-handle"></div>
                    <div class="drawer-inner">
                      <div class="profile-card px-3 py-3 d-flex align-items-center">
                          <img src="assets/erik.jpg" class="rounded-circle me-3 profile-avatar" height="48" width="48" />
                          <div>
                              <div class="fw-bold">Erik</div>
                              <div class="text-muted small">u/seninha</div>
                          </div>
                      </div>

                      <div class="dropdown-divider"></div>

                      <div class="dropdown-section">
                          <a class="dropdown-item d-flex align-items-center" routerLink="/profile" (click)="menuOpen = false">
                              <i class="bi bi-person-circle me-3"></i>
                              <span>Ver Perfil</span>
                          </a>

                          <a class="dropdown-item d-flex align-items-center" (click)="menuOpen = false">
                              <i class="bi bi-person-bounding-box me-3"></i>
                              <span>Editar Avatar</span>
                          </a>
                      </div>

                      <div class="dropdown-divider"></div>

                      <div class="dropdown-section">
                          <button class="dropdown-item d-flex align-items-center text-danger" (click)="logout(); menuOpen = false">
                              <i class="bi bi-box-arrow-right me-3"></i>
                              <span>Log Out</span>
                          </button>

                          <a class="dropdown-item d-flex align-items-center" routerLink="/settings" (click)="menuOpen = false">
                              <i class="bi bi-gear me-3"></i>
                              <span>Settings</span>
                          </a>
                      </div>
                    </div>
                </div>
                <div *ngIf="menuOpen && isMobileView" class="dropdown-backdrop" (click)="onBackdropClick()"></div>
            </div>

        </div>
    </div>
</nav>
